
      

      <html>
        <head>
          <title>Single Marker</title>
          <meta name="viewport" content="initial-scale=1.0">
          <meta charset="utf-8">
          <style>
          html,
          body,
          #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
          }
                          
          </style>
             <script src="https://apis.mappls.com/advancedmaps/api/xgtytffwsfrzmjotufrhoufgluoeepdyeczf/map_sdk?layer=vector&v=3.0&callback=initMap1" defer async></script>
            </head>
        <body>
                    <div id="map"></div>
                      <script>
    var map, Marker1;

    function initMap1() {
      map = new mappls.Map('map', {
        center: [28.61, 77.23],
        zoomControl: true,
        location: true
      });
      Marker1 = new mappls.Marker({
        map: map,
        position: {
          "lat": 28.519467,
          "lng": 77.223150
        },
        fitbounds: true,
        icon_url: 'https://apis.mapmyindia.com/map_v3/1.png'
      });
    }
  </script>
        </body>
      </html>
